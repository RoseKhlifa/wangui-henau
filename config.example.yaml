# 河南农业大学晚归签到 —— 单租户配置
# 复制为 config.yaml 后填入真实值；config.yaml 已在 .gitignore

# 学校签到系统的 JWT（从手机微信抓包获取，Authorization: Bearer 后面那一串）
token: "fictional.jwt.token"

# 兼容单租户 CLI 的规则 ID；Web 调度会在每次签到前读取当前可用规则
rule_id: 1

# 以下均为虚构占位值。实际部署时只在私有 config.yaml 中填写本人合规使用的位置与地址。
# 当前协议要求 address 参与签名，不能留空。
location:
  latitude:  12.345678
  longitude: 98.765432
  device_model:  "Pixel 7"
  device_system: "Android 13"
  address: "示例市测试路 1 号"
  city:    "示例市"
  road:    ""
  poi:     ""

# 调度策略：触发分钟（小时固定 22:00 窗口）
schedule:
  primary_minute_offset: 2   # 22:02 首次尝试
  primary_jitter_sec: 180    # +0~180 秒抖动
  retry_minute_offsets: [8, 15, 22]   # 失败后在 22:08 / 22:15 / 22:22 重试

# 日志
log:
  file: "wangui.log"
  level: "info"   # debug | info | warn | error
